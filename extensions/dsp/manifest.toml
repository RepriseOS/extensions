    "rv_sin_cos",
    "rv_sqrt",
    "rv_decibels",
    "rv_dsp_biquad",
    "rv_dsp_attenuate",
    "rv_dsp_response",
    "rv_dsp_peak",
    "rv_dsp_bishelf",
