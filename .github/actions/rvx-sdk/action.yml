name: Set up the RVX SDK
description: Check out the SDK revision used to build and verify releases
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: lgreitis/osos-lab
        ref: 4de51b2bb55e6d5e75a10b0005e5eefcc484b9b1
        path: .sdk
        sparse-checkout: rvx-sdk
        persist-credentials: false
    - shell: bash
      run: echo "SDK=$GITHUB_WORKSPACE/.sdk/rvx-sdk" >> "$GITHUB_ENV"
